<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a19">
  <link rel="manifest" href="/static/manifest.json">
  <title>Niyat · UZEX 2035</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/trade.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><b>Niyat</b><span>UZEX 2035</span></div>
      <div class="lang"><button data-lang="uz">UZ</button><button data-lang="ru">RU</button></div>
    </header>
    <div class="wallet"><span id="wallet-label"></span><b id="wallet"></b></div>

    <section class="tab" id="tab-market"></section>

    <section class="tab" id="tab-chat" hidden>
      <main class="thread" id="thread"></main>
      <form class="composer" id="composer">
        <button type="button" class="mic" id="mic" title="Mic" hidden>🎤</button>
        <textarea id="input" rows="1" autocomplete="off"></textarea>
        <button class="primary" type="submit" id="send"></button>
      </form>
    </section>

    <section class="tab" id="tab-folio" hidden></section>

    <nav class="tabbar" id="tabbar">
      <button data-tab="market"></button>
      <button data-tab="chat"></button>
      <button data-tab="folio"></button>
    </nav>
  </div>
  <div class="sheet-back" id="sheet-back" hidden><div class="sheet" id="sheet"></div></div>
  <div class="tip" id="tip" hidden></div>
  <script src="/static/buyer.js"></script>
  <script src="/static/trade.js"></script>
</body>
</html>
