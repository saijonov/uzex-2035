[project]
name = "uzcom"
version = "0.4.0"
description = "UzCom commodity marketplace demo for the UZEX AI Hackathon 2026 final"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "openai>=2,<3",
  "pydantic-settings>=2.6,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uzcom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
